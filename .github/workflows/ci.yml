name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - run: uname -m && python -c "import platform; print(platform.machine(), platform.python_version())"
      - run: ruff check mailconsole tests scripts deploy/smoke_test.py deploy/capture_postfix.py
      - run: python -m pytest -p no:cacheprovider
      - run: shellcheck -S warning deploy/*.sh scripts/*.sh

  arm64-wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check-arm64-wheels.sh

  deployment:
    # Full install on a real systemd host without Docker, using the system
    # Python 3.12 of Ubuntu 24.04, exactly as on the production server.
    name: install + acceptance (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      ADMIN_PASSWORD: ci-only-password-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a sanitized log file and configuration
        run: |
          sudo apt-get install -y --no-install-recommends python3.12-venv >/dev/null
          sudo install -d -m 0755 /srv/ci
          sudo install -m 0640 -o root -g adm tests/fixtures/syslog-iso.log /srv/ci/syslog
          sudo install -d -m 0755 /etc/mail-console
          sed -e 's#^MC_LOG_PATH=.*#MC_LOG_PATH=/srv/ci/syslog#' -e 's#^MC_POLL_INTERVAL=.*#MC_POLL_INTERVAL=1#' \
            .env.example | sudo tee /etc/mail-console/mail-console.env >/dev/null
      - name: install.sh
        run: sudo ./deploy/install.sh
      - name: Create administrator
        run: echo "$ADMIN_PASSWORD" | sudo mail-console admin create --username admin --password-stdin
      - name: Read-only check
        run: sudo mail-console check || true
      - name: Previously logged emails are visible
        run: |
          sleep 3
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin \
            --expect 3F2A61C0D3 --expect alice@example.org --expect 2B4C6D8E0F --expect "<long-id@example.com>"
      - name: New events appear without manual processing
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%S.%6N+00:00) mail postfix/smtp[777]: C1A0000001: to=<live@example.org>, relay=mx.example.org[203.0.113.25]:25, delay=0.5, delays=0/0/0.2/0.3, dsn=2.0.0, status=sent (250 2.0.0 OK)" | sudo tee -a /srv/ci/syslog >/dev/null
          sleep 4
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin --expect C1A0000001
      - name: Restart keeps history
        run: |
          sudo systemctl restart mail-console-web mail-console-collector
          sleep 3
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin \
            --expect 3F2A61C0D3 --expect C1A0000001
      - name: Log rotation is followed
        run: |
          sudo mv /srv/ci/syslog /srv/ci/syslog.1
          echo "$(date -u +%Y-%m-%dT%H:%M:%S.%6N+00:00) mail postfix/smtp[778]: C1A0000002: to=<late@example.org>, relay=none, delay=1, delays=0/0/1/0, dsn=4.4.1, status=deferred (connect to mx.example.org[203.0.113.25]:25: Connection timed out)" | sudo tee -a /srv/ci/syslog.1 >/dev/null
          echo "$(date -u +%Y-%m-%dT%H:%M:%S.%6N+00:00) mail postfix/smtp[779]: C1A0000003: to=<rotated@example.org>, relay=mx.example.org[203.0.113.25]:25, delay=1, delays=0/0/1/0, dsn=2.0.0, status=sent (250 ok)" | sudo install -m 0640 -o root -g adm /dev/stdin /srv/ci/syslog
          sleep 8
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin \
            --expect C1A0000002 --expect C1A0000003
      - name: Sandbox and binding
        run: |
          systemctl show mail-console-collector -p NoNewPrivileges -p ProtectSystem -p SupplementaryGroups -p User
          systemd-analyze security --no-pager mail-console-web mail-console-collector | tail -n 3
          ss -ltnp | grep 8710 | tee /dev/stderr | grep -q '127.0.0.1:8710'
          sudo stat -c '%a %U:%G %n' /var/lib/mail-console /var/lib/mail-console/mail-console.sqlite3 /etc/mail-console/mail-console.env
          test "$(sudo stat -c %a /var/lib/mail-console/mail-console.sqlite3)" = 600
      - name: Update and rollback
        run: |
          sudo ./deploy/update.sh
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin --expect C1A0000003
          sudo ./deploy/rollback.sh
          sleep 3
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin --expect C1A0000003
      - name: Uninstall
        run: |
          sudo ./deploy/uninstall.sh --purge
          ! systemctl cat mail-console-web 2>/dev/null
          test ! -e /opt/mail-console && test ! -e /var/lib/mail-console
      - name: Service logs
        if: failure()
        run: sudo journalctl -u mail-console-web -u mail-console-collector --no-pager -n 200

  capture-e2e:
    # Real Postfix 3.8 (CI runner only) shaped like production: two named
    # submission listeners (public IP and loopback) with Dovecot SASL, required
    # TLS, restrictions and milter options, plus an existing transport map.
    # The capture change is applied with deploy/capture_postfix.py exactly as
    # documented for production, then fully reversed.
    name: postfix capture e2e (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      ADMIN_PASSWORD: ci-only-password-${{ github.run_id }}
      PUBLIC: 192.0.2.10
    steps:
      - uses: actions/checkout@v4
      - name: Install Postfix and Dovecot SASL (CI runner only)
        run: |
          echo "postfix postfix/main_mailer_type select Local only" | sudo debconf-set-selections
          echo "postfix postfix/mailname string ci.example.org" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postfix dovecot-core ssl-cert python3.12-venv >/dev/null
          sudo make-ssl-cert generate-default-snakeoil --force-overwrite
          postconf -h mail_version
          sudo ip addr add "$PUBLIC/32" dev lo
          printf '%s\n' 'protocols = none' 'auth_mechanisms = plain login' 'disable_plaintext_auth = no' \
            'passdb {' '  driver = passwd-file' '  args = scheme=PLAIN username_format=%u /etc/dovecot/ci-users' '}' \
            'userdb {' '  driver = static' '  args = uid=nobody gid=nogroup home=/nonexistent' '}' \
            'service auth {' '  unix_listener /var/spool/postfix/private/auth {' '    mode = 0660' \
            '    user = postfix' '    group = postfix' '  }' '}' | sudo tee /etc/dovecot/local.conf >/dev/null
          echo 'app@ci.example.org:{PLAIN}ci-secret' | sudo tee /etc/dovecot/ci-users >/dev/null
          sudo systemctl restart dovecot
          sudo install -m 0640 -o root -g adm /dev/null /var/log/postfix.log
          sudo postconf -e maillog_file=/var/log/postfix.log \
            smtpd_tls_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            smtpd_tls_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          # Existing routing that must survive (stands in for the bounce collector).
          echo 'bounces@ci.example.org  discard:' | sudo tee /etc/postfix/transport >/dev/null
          sudo postmap /etc/postfix/transport
          sudo postconf -e transport_maps=hash:/etc/postfix/transport
          # Production-style named submission listeners.
          for host in "$PUBLIC" 127.0.0.1; do
            echo "$host:submission inet n - y - - smtpd -o syslog_name=postfix/submission-$host -o smtpd_tls_security_level=encrypt -o smtpd_sasl_auth_enable=yes -o smtpd_sasl_type=dovecot -o smtpd_sasl_path=private/auth -o smtpd_tls_auth_only=yes -o smtpd_client_restrictions=permit_sasl_authenticated,reject -o smtpd_recipient_restrictions=permit_sasl_authenticated,reject -o smtpd_milters=inet:127.0.0.1:8891 -o milter_default_action=accept -o milter_macro_daemon_name=ORIGINATING" \
              | sudo tee -a /etc/postfix/master.cf >/dev/null
          done
          sudo postfix check
          sudo systemctl restart postfix
          sudo postconf -M | grep submission
      - name: Install Mail Console
        run: |
          sudo install -d -m 0755 /etc/mail-console
          sed -e 's#^MC_LOG_PATH=.*#MC_LOG_PATH=/var/log/postfix.log#' -e 's#^MC_POLL_INTERVAL=.*#MC_POLL_INTERVAL=1#' \
            .env.example | sudo tee /etc/mail-console/mail-console.env >/dev/null
          sudo ./deploy/install.sh
          echo "$ADMIN_PASSWORD" | sudo mail-console admin create --username admin --password-stdin
      - name: Preflight and plan (read-only)
        run: |
          sudo postconf -n > /tmp/n.before; sudo postconf -M > /tmp/M.before; sudo postconf -P > /tmp/P.before
          sudo ./deploy/capture-preflight.sh || [ $? -eq 2 ]
          sudo python3 -I deploy/capture_postfix.py plan | tee /tmp/plan.txt
          grep -q "$PUBLIC:submission/inet.*<- capture" /tmp/plan.txt
          grep -q "127.0.0.1:submission/inet.*loopback: not captured" /tmp/plan.txt
          sudo postconf -n | diff /tmp/n.before - && sudo postconf -M | diff /tmp/M.before -   # plan changed nothing
          # A generic name that does not exist is refused, never created.
          ! sudo python3 -I deploy/capture_postfix.py plan --listener submission
      - name: Apply (as documented) and verify
        run: |
          sudo python3 -I deploy/capture_postfix.py apply --yes
          sudo postfix reload
          sudo python3 -I deploy/capture_postfix.py status
          test "$(sudo postconf -P "$PUBLIC:submission/inet/cleanup_service_name")" = \
               "$PUBLIC:submission/inet/cleanup_service_name = cleanup-archive"
          test -z "$(sudo postconf -P 127.0.0.1:submission/inet/cleanup_service_name 2>/dev/null)"
          test "$(sudo postconf -M cleanup/unix | awk '{print $3,$4,$5,$6,$7}')" = \
               "$(sudo postconf -M cleanup-archive/unix | awk '{print $3,$4,$5,$6,$7}')"
          test "$(sudo postmap -q bounces@ci.example.org hash:/etc/postfix/transport)" = "discard:"
          sudo postconf -h transport_maps
      - name: Public listener is archived, loopback is not, everyone is delivered
        run: |
          python3 scripts/send_test_mail.py --host "$PUBLIC" --port 587 --starttls --user app@ci.example.org \
            --password ci-secret --to root@localhost --to postmaster@localhost
          python3 scripts/send_test_mail.py --host 127.0.0.1 --port 587 --starttls --user app@ci.example.org \
            --password ci-secret --to root@localhost --only-plain --tag LOOPBACK-CI
          sleep 12
          sudo grep -E "archive@mail-console.invalid|status=" /var/log/postfix.log | tail -n 14
          test "$(sudo mail-console archive status | awk '$1=="archives"{print $2}')" = 2
          test -z "$(sudo ls -A /var/spool/mail-console/incoming)"
          sudo mail-console archive verify
          test "$(sudo postqueue -j | wc -l)" = 0
          ! sudo grep -q "status=bounced\|status=deferred" /var/log/postfix.log
          echo "$ADMIN_PASSWORD" | python3 deploy/smoke_test.py --username admin --password-stdin \
            --expect-archive ACTIVATION-CI --expect-archive PLAIN-CI-BODY
          # The loopback submission was delivered and has no archive copy.
          LQ=$(sudo grep "postfix/submission-127.0.0.1/smtpd.*client=" /var/log/postfix.log | tail -1 | sed -E 's/.*\]: ([0-9A-F]+): client=.*/\1/')
          test -n "$LQ"
          sudo grep "$LQ: to=<root@localhost>.*status=sent" /var/log/postfix.log
          ! sudo grep -q "$LQ: to=<archive@mail-console.invalid>" /var/log/postfix.log
      - name: A broken capture defers only the archive copy, never bounces
        run: |
          sudo chmod 0000 /var/spool/mail-console/incoming
          python3 scripts/send_test_mail.py --host "$PUBLIC" --port 587 --starttls --user app@ci.example.org \
            --password ci-secret --to root@localhost --only-plain --tag BROKEN-CI
          sleep 10
          sudo grep -E "BROKEN-CI|status=" /var/log/postfix.log | tail -n 6
          QID=$(sudo grep "to=<archive@mail-console.invalid>.*status=deferred" /var/log/postfix.log | tail -1 | sed -E 's/.*\]: ([0-9A-F]+):.*/\1/')
          test -n "$QID"
          sudo grep "$QID: to=<root@localhost>.*status=sent" /var/log/postfix.log
          ! sudo grep -q "$QID: sender non-delivery notification" /var/log/postfix.log
          ! sudo grep -q "$QID: to=<root@localhost>.*status=\(bounced\|deferred\)" /var/log/postfix.log
          sudo mail-console archive status | grep -E "deferred_copies|level"
          sudo chmod 2770 /var/spool/mail-console/incoming
          sudo postqueue -f     # CI only: retry the deferred archive copy now
          sleep 8
          test "$(sudo mail-console archive status | awk '$1=="archives"{print $2}')" = 3
          test "$(sudo postqueue -j | wc -l)" = 0
      - name: Deactivate restores the exact previous configuration
        run: |
          sudo python3 -I deploy/capture_postfix.py deactivate
          sudo postfix reload
          sudo python3 -I deploy/capture_postfix.py status
          sudo python3 -I deploy/capture_postfix.py deactivate --finish
          sudo postfix reload
          sudo postconf -n | diff /tmp/n.before -
          sudo postconf -M | diff /tmp/M.before -
          sudo postconf -P | diff /tmp/P.before -
          python3 scripts/send_test_mail.py --host "$PUBLIC" --port 587 --starttls --user app@ci.example.org \
            --password ci-secret --to root@localhost --only-plain --tag AFTER-CI
          sleep 8
          test "$(sudo mail-console archive status | awk '$1=="archives"{print $2}')" = 3
          sudo grep "status=sent" /var/log/postfix.log | tail -n 2
      - name: Logs
        if: failure()
        run: |
          sudo tail -n 120 /var/log/postfix.log || true
          sudo journalctl -u mail-console-web -u mail-console-collector -u dovecot --no-pager -n 120
          sudo ls -laR /var/spool/mail-console || true
