# Example HTTPS reverse proxy for BeastPing Mail Console. NOT installed automatically.
# Review and adapt; deploying it is a separate, explicitly approved change.
#
# Matching settings in /etc/mail-console/mail-console.env:
#   MC_ALLOWED_HOSTS=console.example.com
#   MC_TRUST_PROXY=true
#
# Prefer an SSH tunnel when possible:
#   ssh -N -L 8710:127.0.0.1:8710 admin@mail.example.com   ->  http://localhost:8710

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Access restriction: only known administrator networks.
    allow 198.51.100.0/24;   # replace with your office/VPN range
    deny all;

    # Optional second factor in front of the application login:
    # auth_basic "Mail Console";
    # auth_basic_user_file /etc/nginx/mail-console.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        # Overwrite (do not append) so the console sees the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
